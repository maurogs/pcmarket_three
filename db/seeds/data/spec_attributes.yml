# Spec attributes and their options (key -> definition), loaded by
# db/seeds/spec_attributes.rb. Admin-editable reference data:
#   group       : groups filters together in the UI
#   input_type  : select | number | text (see the SpecAttribute enum)
#   unit        : short unit appended to bare values (not translated)
#   names       : attribute label in all 6 locales
#   options     : for select attributes, listed in display order.
#                 `popular: true` renders in the default filter list, the
#                 rest sit behind a "show more" toggle.
#                 `display` is the label when it is identical in every
#                 locale (brands, standards); a full `names` map when it
#                 must be translated. `value` is the stored slug.
# Top-level keys starting with "x-" are YAML anchor helpers, skipped by the loader.

