# Category tree for PCMarket (slug -> names in all 6 locales, icon, SEO copy).
# Roots carry an `icon` (icon name used by the nav chrome) and a short
# `seo_description`. Children inherit nothing; add seo_description only when
# the admin team writes one. Keep slugs stable: they are public URLs.
#
# Load order is the order below; `position` is assigned automatically as
# 1..n among siblings.

