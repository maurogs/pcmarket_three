# two autonomous cities (Ceuta and Melilla). `code` is the INE two-digit code;
# `name` is the province name, a proper noun shared across all locales (same
# approach as the seeded taxonomy's display strings). `region` groups
# provinces by autonomous community so the select can use option groups.
