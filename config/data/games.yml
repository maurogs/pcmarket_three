# Popular game titles used by the PC Finder quiz and the FPS estimator.
#
# demand        rough hardware appetite (light / medium / heavy) — display copy.
# required_score  approximate Performance::Scorer composite score a PC needs
#                 to run the title smoothly at that resolution / FPS target
#                 (defaults settings; capped at 1000, the RTX 5090 reference).
# Names are product names (proper nouns) and stay as-is in every locale.

fortnite:
  name: Fortnite
  demand: medium
  required_score:
    "1080p": { "60": 250, "144": 480, "240": 800 }
    "1440p": { "60": 380, "144": 700, "240": 980 }
    "2160p": { "60": 580, "144": 950, "240": 1000 }

