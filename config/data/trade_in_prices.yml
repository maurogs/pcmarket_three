# Base trade-in payouts per component model, BEFORE the condition multiplier
# and box discount applied by TradeIns::Quote:
#   offered = base_cents × condition_multiplier × (has_box ? 1 : 0.95)
#
# Model keys match the normalized keys of gpu_tiers.yml / cpu_tiers.yml
# (Performance::Scorer.normalize) and carry a human `display` name for the
# dropdown. Values are conservative second-hand market estimates (resale
# minus refurb margin). "Admin-editable later" — the plan is to move this to
# a DB table; models absent here simply have no offer (the form only lists
# the models found in this file).

