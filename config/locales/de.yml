    about:
      title: Über PCMarket
      lede: PCMarket ist der Marktplatz für PC-Hardware in unserem Markt — neu und gebraucht, gebaut von Menschen, die PCs bauen.
      cards:
        mission:
          title: Eine Kategorie, richtig gemacht
          text: Allgemeine Marktplätze begraben PC-Teile im Rauschen. Wir gehen stattdessen in die Tiefe bei Spezifikationen, Sockeln und Kompatibilität.
        wide:
          title: Neu und gebraucht nebeneinander
          text: Upgrader, Werkstatt und Hobbyisten teilen denselben Katalog — jede Anzeigenart ist willkommen, solange sie ehrlich ist.
        fair:
          title: Fair für beide Seiten
          text: Klarer Schutz für Käufer, klare Regeln und schnelle Auszahlungen für Verkäufer.
      story:
        title: Warum wir angefangen haben
        p1: 'Wer schon einmal eine kompatible Grafikkarte, einen CPU-Sockel oder ein Laptop-Display gesucht hat, kennt den Schmerz: Die Hälfte der Anzeigen lässt genau die eine Spezifikation weg, die über Kompatibilität entscheidet — und niemand schützt die Transaktion.'
        p2: PCMarket löst beide Probleme. Strukturierte Spezifikationen in jeder Anzeige, menschliche Moderation vor der Veröffentlichung und Käuferschutz bei jeder Bestellung.
      values:
        title: Wofür wir einstehen
        items:
          a: Ehrliche Anzeigen — durch echte Moderatoren durchgesetzt, nicht nur durch Bots.
          b: Schnelle, menschliche Hilfe.
          c: 'Transparente Regeln: Lies sie, sie sind kurz.'
          d: Datenschutz by default — nur die Daten, die ein Verkauf wirklich braucht.
      promise:
        title: Unser Versprechen
        text: Jede Bestellung auf PCMarket ist geschützt. Wenn etwas schiefgeht, lösen wir es.
        trust_cta: So schützen wir dich
        contact_cta: Sprich mit uns
    how_it_works:
      title: So funktioniert's
      lede: Von der Suche bis zur Haustür in wenigen kleinen Schritten.
      search:
        title: Finde das Teil
        filter:
          title: Filter, die Spezifikationen respektieren
          text: Filtere nach Sockel, Chipsatz, Kapazität, Zustand und mehr. Spezifikationen sind in jeder Anzeige strukturiert — deshalb funktionieren die Filter wirklich.
        series:
          title: Kuratierte Serien
          text: Stöbere in kuratierten Übersichten der besten Komponenten nach Bereich.
        pc_finder:
          title: PC-Finder-Quiz
          text: Weißt du nicht, was du brauchst? Beantworte ein paar Fragen und wir schlagen kaufbereite Gaming-PCs vor.
      buy:
        title: Sicher kaufen
        reserve:
          title: Den Artikel reservieren
          text: Bestellen sichert den Bestand — die Anzeige ist in dem Moment reserviert, in dem du bestellst.
        pay:
          title: An der Kasse zahlen
          text: Eine Kasse, ein klarer Gesamtbetrag. Kartendaten werden von unserem Zahlungsanbieter verarbeitet und von uns nie gespeichert.
        receive:
          title: Erhalten und bestätigen
          text: Verfolge die Bestellung, bestätige die Lieferung, hinterlasse eine Bewertung. Wenn etwas nicht stimmt, eröffne vor der Bestätigung eine Streitigkeit.
        escrow_note: Kartenzahlungen werden von unserem Zahlungsanbieter erfasst und an den Verkäufer ausgezahlt, sobald du die Lieferung bestätigst.
        direct_note: Nach der Bestellung werden Zahlung und Lieferung auf der Bestellseite vereinbart. Wickle immer über PCMarket ab und halte die Unterhaltung im Chat.
        trust_link: Der vollständige Käuferschutz-Guide.
      pay:
        title: Ein klarer Gesamtbetrag
        items:
          methods: Zahle per Karte, oder wickle direkt ab, wo dieser Modus aktiv ist.
          hold: Die Anzeige wird in dem Moment für dich gehalten, in dem du bestellst.
          receipt: Jede Bestellung hat ein aufgeschlüsseltes Protokoll, das du jederzeit ansehen kannst.
      more:
        title: Gut zu wissen
        tracking:
          title: Bestellungen verfolgen
          text: Bestellungen haben eine Statusseite in deinem Konto mit jedem protokollierten Schritt.
        trust:
          title: Käuferschutz
          text: Was abgedeckt ist, was nicht, und wie Streitigkeiten funktionieren.
        help:
