    selling:
      title: Verkaufen auf PCMarket
      lede: Deine Ersatz-Grafikkarte ist das Upgrade jemandes. Stelle sie in Minuten ein und werde bezahlt, wenn sie versandt wird.
      steps:
        title: Vier Schritte zum ersten Verkauf
        create:
          title: Eine starke Anzeige erstellen
          text: Fotos des tatsächlichen Artikels, ein ehrlicher Zustand und vor allem die vollständige Spezifikationsliste. Strukturierte Spezifikationen bringen Käufer zum Klick.
        review:
          title: Eine schnelle Prüfung bestehen
          text: Ein Moderator prüft die Anzeige, bevor sie öffentlich wird. Die meisten Anzeigen bestehen innerhalb eines Werktags.
        sell:
          title: Chatten, reservieren, versenden
          text: Beantworte Fragen, akzeptiere Angebote, wenn sie dir gefallen, und versende mit Sendungsverfolgung. Die Bestellseite führt dich durch jeden Schritt.
        get_paid:
          title: Bezahlt werden
          text: Die Auszahlung erfolgt, nachdem der Käufer die Lieferung bestätigt. Verifizierte Verkäufer werden schneller ausgezahlt.
      fees:
        title: Gebühren
        pct: PCMarket berechnet %{percent}% Provision auf abgeschlossene Verkäufe.
        zero: Null Provision während der Startphase von PCMarket — du behältst 100 % jedes Verkaufs.
        note: Das Einstellen ist kostenlos. Du zahlst erst, wenn ein Verkauf abgeschlossen ist.
      tips:
        title: Tipps unserer besten Verkäufer
        items:
          a: Fotografiere den Artikel selbst — Stockfotos werden übersehen.
          b: 'Nenne die Spezifikationen, nach denen Käufer suchen: Sockel, Chipsatz, Kapazität, Betriebsstunden.'
          c: Preise dich nach verkauften Vergleichsobjekten, nicht nach Hoffnungen.
          d: Versende innerhalb eines Werktags — Geschwindigkeit ist der wichtigste Bewertungsfaktor.
          e: Antworte schnell im Chat; späte Antworten kosten Verkäufe.
          f: Sei ehrlich über Mängel. Ein beschriebener Mangel schlägt eine überraschende Rücksendung.
      requirements:
        title: Bevor du einstellst
        items:
          a: Der Artikel muss dir gehören und in deinem Land zulässig sein.
          b: Unzulässige Artikel (Fälschungen, unsichere Teile) werden entfernt — lies zuerst die Regeln.
          c: Verkäufer müssen 18 sein oder mit elterlicher Einwilligung verkaufen.
          d: Versand- und Rückgabepflichten unterscheiden sich, wenn du gewerblich statt privat verkaufst.
        guides_link: Verkäuferhandbuch
        terms_link: Nutzungsbedingungen
      cta:
        title: Bereit, wenn du es bist
        subtitle: Ein Konto anzulegen ist kostenlos, das Einstellen dauert Minuten.
        start: Anzeige erstellen
        trade_in: Oder verkaufe uns die ganze Maschine
    contact:
      title: Kontakt
      lede: Eine Frage zu einer Bestellung, einer Anzeige oder zur Plattform selbst? Hier erreicht sie einen Menschen.
      form:
        title: Schreib uns eine Nachricht
        hint: Wir antworten innerhalb eines Werktags, in der Sprache, in der du schreibst.
        submit: Nachricht senden
        rate_limit: Bis zu 5 Nachrichten pro halber Stunde.
      channels:
