        hours_text: Montag bis Freitag, 9:00–18:00. Bestellungen laufen rund um die Uhr weiter.
    help:
      title: Hilfe-Center
      lede: Kurze Antworten auf die häufigsten Fragen. Suche oder arbeite ein Thema durch.
      search_label: Hilfethemen durchsuchen
      search_placeholder: Gib ein Wort ein, wie „Erstattung" oder „Versand"
      no_results: Dazu passt nichts — versuche ein anderes Wort oder kontaktiere uns.
      groups:
        buying: Kauf
        selling: Verkauf
        payments: Zahlungen
        shipping: Versand
        account: Konto
      faq:
        buying:
          q1: Woran erkenne ich, ob ein Teil kompatibel ist?
          a1: Jede Anzeige veröffentlicht strukturierte Spezifikationen — Sockel, Chipsatz, Kapazität, Bauform. Die Filter respektieren sie, und Gaming-PCs tragen einen Kompatibilitätshinweis.
          q2: Kann ich den Preis verhandeln?
          a2: 'Viele Verkäufer akzeptieren Angebote: Wenn die Anzeige einen „Angebot machen"-Button zeigt, sende eins — der Verkäufer kann im Chat annehmen, ablehnen oder kontern.'
          q3: Wie beurteile ich einen Verkäufer?
          a3: Seine Store-Seite zeigt Durchschnittsbewertung, abgeschlossene Verkäufe und ob er das Verifizierungsabzeichen trägt. Neue Konten verdienen besondere Vorsicht.
        selling:
          q1: Wie lange dauert die Genehmigung einer Anzeige?
          a1: Die meisten Anzeigen werden innerhalb eines Werktags geprüft. Du erhältst eine E-Mail, wenn die Anzeige online geht — oder den Grund, wenn sie nicht besteht.
          q2: Wann werde ich bezahlt?
          a2: Die Auszahlung erfolgt kurz nach der Lieferbestätigung des Käufers; verifizierte Verkäufer werden schneller ausgezahlt. Die Verkaufsdetails im Dashboard zeigen den genauen Stand.
          q3: Kann ich einen Verkauf stornieren?
          a3: Nur vor dem Versand. Ist das Paket unterwegs, laufen Stornierungen über den Streitigkeitsablauf, damit der Käufer geschützt bleibt.
        payments:
          q1: Welche Zahlungsmethoden funktionieren?
          a1: Kartenzahlungen werden an der Kasse verarbeitet. Wo direkte Abwicklung aktiv ist, erklärt die Bestellseite, wie Käufer und Verkäufer sie abschließen.
          q2: Werden meine Kartendaten gespeichert?
          a2: Nie. Kartendaten verarbeitet unser Zahlungsanbieter; PCMarket behält nur das Transaktionsprotokoll.
          q3: Wann wird meine Karte belastet?
          a3: An der Kasse. Bei geschützten Bestellungen erreicht der Betrag den Verkäufer erst nach bestätigter Lieferung.
        shipping:
          q1: Wer zahlt den Versand?
          a1: Der Käufer, wie an der Kasse ausgewiesen. Verkäufer können auch kostenlosen Versand oder Abholung anbieten.
          q2: Wie verfolge ich meine Bestellung?
          a2: Jede Bestellung hat eine Statusseite in deinem Konto, und Verkäufer hängen bei Versand eine Sendungsnummer an.
          q3: Was, wenn das Paket beschädigt ankommt?
          a3: Fotografiere es, melde den Schaden möglichst beim Zusteller und eröffne innerhalb von 48 Stunden eine Streitigkeit — Schadensfälle laufen am schnellsten.
        account:
          q1: Wie ändere ich mein Passwort?
          a1: In den Kontoeinstellungen unter Sicherheit. Nutze „Passwort vergessen", wenn du dich nicht anmelden kannst.
          q2: Kann ich mein Konto löschen?
          a2: Ja — die Kontoeinstellungen enthalten die Löschung von Daten mit einer kurzen Frist, bevor sie endgültig wird.
          q3: Kann ich meine Daten exportieren?
          a3: Ein Klick in den Kontoeinstellungen erzeugt eine maschinenlesbare Kopie deiner Anzeigen, Bestellungen und Nachrichten.
      still_lost:
        title: Immer noch nicht fündig?
        text: Ein Mensch liest jede Nachricht — mit Bestellnummer noch schneller.
        cta: Kontaktiere uns
    seller_guides:
      title: Verkäuferhandbuch
      lede: Das Vorgehen unserer am besten bewerteten Verkäufer. Sechs kurze Guides.
      guides:
        photos:
          title: Fotografiere den Artikel, den du tatsächlich verkaufst
          text: Naturalicht, mindestens vier Winkel, dazu Nahaufnahmen von Anschlüssen, Etiketten und etwaigen Mängeln. Halte das Seriennummern-Etikett lesbar.
          bullets:
            a: Fotografiere den echten Artikel — niemals ein Stockfoto.
            b: Zeige das Zubehör und die Kabel, die du wirklich beilegst.
            c: Fotografiere Mängel aus der Nähe; Ehrlichkeit macht aus Besuchern Käufer.
        titles:
          title: Schreibe Titel, die zu Suchen passen
          text: Käufer tippen echte Modellnummern, nicht „tolle Grafikkarte". Marke, Modell, Kapazität und Zustand gehören in den Titel.
          bullets:
            a: 'Modellnummer zuerst: „NVIDIA RTX 3070 8GB".'
            b: 'Nenne den Zustand: neu, generalüberholt oder gebraucht.'
            c: Lass GROSSBUCHSTABEN und Emojis weg — sie untergraben Vertrauen.
        specs:
          title: Fülle jedes Spezifikationsfeld aus
          text: Strukturierte Spezifikationen speisen Filter und Kompatibilitätsprüfungen. Ein fehlender Sockel oder Chipsatz versteckt deine Anzeige vor den meisten Suchen.
          bullets:
            a: Fülle das strukturierte Spezifikationsfeld aus, nicht nur die Beschreibung.
            b: Nenne Kapazität, Generation und Schnittstelle, wo sie zutreffen.
            c: Gib bei GPUs und Konsolen die Betriebsstunden an — Käufer fragen sowieso.
        pricing:
          title: Preise dich nach verkauften Vergleichsobjekten
          text: Der Markt zeigt, zu welchen Preisen ähnliche Anzeigen verkauft wurden. Preise leicht darunter für einen schnellen Verkauf, darüber, wenn du warten kannst.
          bullets:
            a: Prüfe kürzlich verkaufte Anzeigen, bevor du den Preis festlegst.
            b: Rechne den Versand in dein Endergebnis ein, bevor du rabattierst.
            c: Ein starrer Preis schlägt ein Schnäppchen mit endlosen Feilsch-Chats.
        shipping:
          title: Verpacke so, als käme es auf das Teil an — tut es
          text: Antistatikbeutel, stabiler Karton, großzügige Polsterung an allen Seiten. Grafikkarten und Mainboards verbiegen im Transport ohne Verstrebungen.
          bullets:
            a: Versende niemals eine GPU lose in einem Umschlag.
            b: Bewahre den Einlieferungsbeleg bis zur bestätigten Lieferung auf.
            c: Hänge die Sendungsnummer sofort auf der Bestellseite an.
        after:
          title: Nach dem Verkauf
          text: Versende innerhalb eines Werktags, hänge das Tracking an und antworte im Chat höflich und schnell. Reibungslose Verkäufe steigern die Conversion beim nächsten.
          bullets:
            a: Ein heute versandtes schlägt ein günstigeres, das Montag versandt wird.
            b: Danke dem Käufer — Bewertungen gelten in beide Richtungen.
            c: Wenn etwas schiefgeht, erst schreiben; Streitigkeiten zuletzt.
      cta:
        title: Setze das um
        subtitle: Eine guide-konforme Anzeige besteht die Prüfung fast immer beim ersten Versuch.
        list: Anzeige erstellen
        selling: Verkaufsüberblick
