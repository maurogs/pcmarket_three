  trusts:
    show:
      title: Trust & Safety
      hero:
        title: Sicher kaufen und verkaufen auf PCMarket
        subtitle: Alles darüber, wie wir Bestellungen schützen, Verkäufer prüfen und den Marktplatz sauber halten.
        badge: Käuferschutz
        open_policy_badge: Unsere Schutzrichtlinie ist öffentlich
      stats:
        completed_orders: Abgeschlossene Bestellungen
        verified_sellers: Verifizierte Verkäufer
        reviewed_listings: Geprüfte Anzeigen
      protection:
        title: So funktioniert der Käuferschutz
        subtitle: Drei einfache Schritte von der Kasse bis zur Haustür.
        one:
          title: Mit Vertrauen reservieren
          text: Eine Bestellung sichert den Bestand. Die Anzeige ist in dem Moment reserviert, in dem du bestellst — niemand kann den Artikel kaufen, den du gerade bestellt hast.
        two:
          title: Den vereinbarten Betrag zahlen
          text: 'Du zahlst genau den an der Kasse angezeigten Preis. Keine versteckten Gebühren, keine Überraschungen: Was du siehst, erhält der Verkäufer.'
        three:
          title: Erhaltene Ware oder dein Geld zurück
          text: Wenn der Artikel nie ankommt oder nicht der Anzeige entspricht, eröffne eine Streitigkeit — unsere Moderatoren entscheiden und erstatten bei berechtigter Beschwerde.
        direct_notice: 'Zahlungen laufen derzeit direkt zwischen Käufer und Verkäufer über die Bestellseite. Diese Tipps halten dich sicher:'
        direct_tip_a: Führe jede Unterhaltung im PCMarket-Chat — er ist dein Beweisprotokoll.
        direct_tip_b: Wickle die Zahlung über den Bestellablauf ab, niemals per Überweisung auf ein privates Konto.
        direct_tip_c: Prüfe Bewertung, abgeschlossene Verkäufe und Verifizierungsstatus des Verkäufers vor der Bestellung.
        direct_tip_d: Bestätige die Lieferung erst, wenn das Paket tatsächlich in deinen Händen ist.
      covered:
        title: Was abgedeckt ist
        items:
          a: Volle Erstattung, wenn dein Artikel nie ankommt.
          b: Volle Erstattung, wenn der Artikel wesentlich von der Anzeige abweicht.
          c: Teilweise Erstattungen bei geringen Abweichungen, in der Streitigkeit vereinbart.
          d: Schutz vom Moment der Zahlung bis zur bestätigten Lieferung.
          e: Ein strukturierter Streitigkeitsablauf, in dem ein Moderator jeden Fall prüft.
          f: 'Ein transparentes Protokoll: Jeder Schritt der Bestellung ist zeitgestempelt.'
        fine_print: Der Schutz gilt für Bestellungen über PCMarket. Missbrauch von Erstattungen führt zur Kontosperrung.
      safeguards:
        title: So halten wir den Marktplatz sauber
        review:
          title: Jede Anzeige wird geprüft
          text: Neue Anzeigen durchlaufen vor der Veröffentlichung eine Moderationswarteschlange. Moderatoren prüfen Fotos, Beschreibung und Kategorie vor der Freigabe.
        verified:
          title: Achte auf das Verifizierungsabzeichen
          text: Verkäufer können ein Verifizierungsabzeichen erhalten, indem sie ihre Identität bestätigen und eine Bilanz abgeschlossener Verkäufe aufbauen.
        reporting:
          title: Melde, was verdächtig ist
          text: Jeder kann eine Anzeige mit einem Klick melden. Genug offene Meldungen stellen die Anzeige direkt zurück in die Prüfwarteschlange.
        chat:
          title: Chats auf der Plattform halten
          text: In einer Streitigkeit lesen Moderatoren den PCMarket-Chat zwischen Käufer und Verkäufer. Im Chat zu bleiben hält deine Beweise gültig.
      support:
        title: Brauchst du Hilfe?
        email_title: E-Mail
        email_hint: Wir antworten innerhalb eines Werktags.
        phone_title: Telefon
        phone_hint: Während der Geschäftszeiten an Werktagen.
        contact_title: Kontaktformular
        contact_hint: Schildere, was passiert ist, und gib die Bestellnummer an, falls du eine hast.
        contact_cta: Zum Kontaktformular
      faq:
        title: Häufige Fragen
        q1: Wird meine Zahlung direkt vom Verkäufer eingezogen?
        a1: Jede Bestellung läuft zuerst über unsere Kasse. Wo Kartenzahlungen aktiv sind, wird der Betrag erst nach bestätigter Lieferung an den Verkäufer ausgezahlt; direkte Abwicklung wird auf der Bestellseite immer erklärt.
        q2: Was, wenn der Artikel nie ankommt?
        a2: Eröffne eine Streitigkeit auf der Bestellseite. Wenn die Sendungsverfolgung keine Zustellung zeigt, erhältst du eine volle Erstattung.
        q3: Kann ich wegen Sinneswandels zurückgeben?
        a3: Käufe bei gewerblichen Verkäufern tragen das gesetzliche 14-tägige Widerrufsrecht. Privatverkäufe folgen der Rückgaberegeln, die der Verkäufer in der Anzeige angibt — immer zuerst nachlesen.
        q4: Woran erkenne ich, dass ein Verkäufer vertrauenswürdig ist?
        a4: Achte auf Bewertung, abgeschlossene Verkäufe und Verifizierungsabzeichen. Ein brandneues Konto ohne Bewertungen verlangt besondere Vorsicht — beginne mit einer kleinen Bestellung.
        q5: Was passiert, wenn ich eine Anzeige melde?
        a5: Ein Moderator prüft sie. Drei offene Meldungen stellen jede aktive Anzeige automatisch zurück in die Prüfwarteschlange, und Verkäufer gegen die Regeln werden sanktioniert.
        q6: Lest ihr meine Chats?
        a6: Chats sind privat. In einer Streitigkeit können Moderatoren die Unterhaltung zwischen Käufer und Verkäufer lesen, um fair zu entscheiden.
      cta:
        title: Bereit, mit gutem Gefühl zu kaufen?
        subtitle: Stöbere in Anzeigen mit PCMarket-Käuferschutz.
        browse: Anzeigen ansehen
        how_it_works: So funktioniert's ansehen
