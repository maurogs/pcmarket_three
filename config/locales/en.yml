  trusts:
    show:
      title: Trust & Safety
      hero:
        title: Buying and selling safely on PCMarket
        subtitle: Everything you need to know about how we protect orders, vet sellers and keep the marketplace clean.
        badge: Buyer protection
        open_policy_badge: Our protection policy is public
      stats:
        completed_orders: Completed orders
        verified_sellers: Verified sellers
        reviewed_listings: Reviewed listings
      protection:
        title: How buyer protection works
        subtitle: Three simple steps from checkout to doorstep.
        one:
          title: Reserve with confidence
          text: Placing an order locks the stock. The listing is reserved the moment you check out, so nobody can buy the item you just ordered.
        two:
          title: Pay the agreed amount
          text: 'You pay exactly the price shown at checkout. No hidden charges, no surprises: what you see is what the seller receives.'
        three:
          title: Receive it or get your money back
          text: If the item never arrives or doesn't match the listing, open a dispute and our moderators decide — with refunds when they agree with you.
        direct_notice: 'Payments are currently settled directly between buyer and seller on the order page. Follow these tips to stay safe:'
        direct_tip_a: Keep every conversation inside PCMarket chat — it is your evidence trail.
        direct_tip_b: Settle payment through the order flow, never by transfer to a stranger's personal account.
        direct_tip_c: Check the seller's rating, completed sales and verified badge before committing.
        direct_tip_d: Confirm delivery once — and only once — the parcel is actually in your hands.
      covered:
        title: What is covered
        items:
          a: Full refund if your item never arrives.
          b: Full refund if the item is materially different from the listing.
          c: Partial refunds for minor discrepancies, agreed through the dispute.
          d: Protection from the moment you pay until delivery is confirmed.
          e: A structured dispute flow where a moderator reviews every case.
          f: 'A transparent record: every step of the order is time-stamped.'
        fine_print: Protection applies to orders placed through PCMarket. Abusing refunds is grounds for account suspension.
      safeguards:
        title: How we keep the marketplace clean
        review:
          title: Every listing is reviewed
          text: New listings pass through a moderation queue before going live. Moderators check photos, description and category before approving.
        verified:
          title: Look for the verified badge
          text: Sellers can earn a verification badge by confirming their identity and building a record of completed sales.
        reporting:
          title: Report anything suspicious
          text: Anyone can report a listing in one click. Enough open reports put the listing straight back into the review queue.
        chat:
          title: Keep chats on the platform
          text: In a dispute, moderators read the PCMarket chat between buyer and seller. Staying in chat keeps your evidence valid.
      support:
        title: Need a hand?
        email_title: E-mail
        email_hint: We answer within one business day.
        phone_title: Phone
        phone_hint: During weekday business hours.
        contact_title: Contact form
        contact_hint: Tell us what happened and include the order number if you have one.
        contact_cta: Go to the contact form
      faq:
        title: Frequently asked questions
        q1: Is my payment taken directly by the seller?
        a1: Every order runs through our checkout first. Where card payments are enabled, funds are released to the seller only after delivery is confirmed; direct settlement is always explained on the order page.
        q2: What if the item never arrives?
        a2: Open a dispute from the order page. When tracking shows no delivery, you get a full refund.
        q3: Can I return something because I changed my mind?
        a3: Purchases from professional sellers carry the legal 14-day withdrawal right. Private sales follow the return policy the seller states on the listing — always check it first.
        q4: How do I know a seller is trustworthy?
        a4: Look at their rating, completed sales and verified badge. A brand-new account without reviews deserves extra caution — start with a small order.
        q5: What happens when I report a listing?
        a5: A moderator reviews it. Three open reports put any live listing back into the review queue automatically, and sellers who break the rules get sanctioned.
        q6: Do you read my chats?
        a6: Chats are private. In a dispute, moderators can read the conversation between buyer and seller so they can decide fairly.
      cta:
        title: Ready to buy with peace of mind?
        subtitle: Browse listings covered by PCMarket buyer protection.
