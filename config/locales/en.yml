    about:
      title: About PCMarket
      lede: PCMarket is the marketplace dedicated to PC hardware in our market — new and second-hand, built by people who build PCs.
      cards:
        mission:
          title: One category, done properly
          text: General marketplaces bury PC parts in noise. We go deep on specs, sockets and compatibility instead.
        wide:
          title: New and second-hand side by side
          text: Upgraders, repair shops and hobbyists share the same catalogue — every listing type is welcome as long as it is honest.
        fair:
          title: Fair for both sides
          text: Clear protection for buyers, clear rules and prompt payouts for sellers.
      story:
        title: Why we started
        p1: 'Anyone who has hunted for a compatible graphics card, CPU socket or laptop panel knows the pain: half the listings omit the one spec that decides compatibility, and nobody protects the transaction.'
        p2: PCMarket fixes both problems. Structured specifications on every listing, human moderation before publication and buyer protection on every order.
      values:
        title: What we hold to
        items:
          a: Honest listings — enforced by real moderators, not bots alone.
          b: Fast, human support.
          c: 'Transparent rules: read them, they are short.'
          d: Privacy by default — only the data a sale actually needs.
      promise:
        title: Our promise
        text: Every order on PCMarket is protected. If something goes wrong, we fix it.
        trust_cta: How we protect you
        contact_cta: Talk to us
    how_it_works:
      title: How it works
      lede: From search to doorstep in a handful of small steps.
      search:
        title: Find the part
        filter:
          title: Filters that respect specs
          text: Filter by socket, chipset, capacity, condition and more. Specs are structured on every listing, so the filters actually work.
        series:
          title: Curated series
          text: Browse curated roundups of the best components by range.
        pc_finder:
          title: PC Finder quiz
          text: Not sure what you need? Answer a few questions and we suggest ready-to-buy gaming PCs.
      buy:
        title: Buy safely
        reserve:
          title: Reserve the item
          text: Ordering locks stock — the listing is reserved the moment you check out.
        pay:
          title: Pay at checkout
          text: One checkout, one clear total. Card details are processed by our payment provider and never stored by us.
        receive:
          title: Receive and confirm
          text: Track the order, confirm delivery, leave a review. If something is off, open a dispute before confirming.
        escrow_note: Card payments are captured by our payment provider and released to the seller once you confirm delivery.
        direct_note: After checkout, payment and delivery are arranged on the order page. Always settle through PCMarket and keep the conversation in chat.
        trust_link: Read the full buyer protection guide.
      pay:
        title: One clear total
        items:
          methods: Pay by card, or settle directly where that mode is enabled.
          hold: The listing is held for you the moment you order.
          receipt: Every order has an itemised record you can revisit at any time.
      more:
        title: Good to know
        tracking:
          title: Track your orders
          text: Orders have a status page inside your account with every recorded step.
        trust:
          title: Buyer protection
          text: What is covered, what is not, and how disputes work.
        help:
          title: Help centre
          text: Answers to the questions we get most often.
      cta:
        title: Your next part is one click away
        browse: Browse listings
        sell: Start selling
    selling:
      title: Sell on PCMarket
      lede: Your spare graphics card is someone's upgrade. List it in minutes and get paid when it ships.
      steps:
        title: Four steps to your first sale
        create:
          title: Create a great listing
          text: Photos of the actual item, an honest condition and — above all — the full specification list. Structured specs are what make buyers click.
        review:
          title: Pass a quick review
          text: A moderator checks the listing before it goes public. Most listings pass within one business day.
        sell:
          title: Chat, reserve, ship
          text: Answer questions, accept offers if you like them, then ship with tracking. The order page walks you through each step.
        get_paid:
          title: Get paid
          text: Funds settle after the buyer confirms delivery. Verified sellers settle faster.
      fees:
        title: Fees
        pct: PCMarket charges a %{percent}% commission on completed sales.
        zero: Zero commission while PCMarket is in its launch period — you keep 100% of every sale.
        note: Listing is free. You are only charged when a sale completes.
      tips:
        title: Tips from our best sellers
        items:
          a: Photograph the item itself — stock photos get scrolled past.
          b: 'List the specs buyers search for: socket, chipset, capacity, hours used.'
          c: Price from sold comparables, not from hopes.
          d: Ship within one business day — speed is the number-one review driver.
          e: Answer chat messages quickly; slow replies lose sales.
          f: Be honest about faults. A described flaw beats a surprise return.
      requirements:
        title: Before you list
        items:
          a: The item must be yours to sell and legal in your country.
          b: Prohibited items (counterfeits, unsafe parts) are removed — read the rules first.
          c: Sellers must be 18 or selling with parental consent.
          d: Shipping and return duties differ when you sell as a business rather than privately.
        guides_link: Seller guides
        terms_link: Terms of service
