        help_cta: Open the help centre
        hours_title: Support hours
        hours_text: Monday to Friday, 9:00–18:00. Orders keep moving around the clock.
    help:
      title: Help centre
      lede: Short answers to the questions we get most. Search, or dig through a topic.
      search_label: Search help topics
      search_placeholder: Type a word, like "refund" or "shipping"
      no_results: Nothing matches that search — try another word, or contact us.
      groups:
        buying: Buying
        selling: Selling
        payments: Payments
        shipping: Shipping
        account: Account
      faq:
        buying:
          q1: How do I know if a part is compatible?
          a1: Every listing publishes structured specs — socket, chipset, capacity, form factor. Filters respect them, and gaming PCs carry a compatibility note.
          q2: Can I negotiate the price?
          a2: 'Many sellers accept offers: if the listing shows a "Make offer" button, send one and the seller can accept, decline or counter in chat.'
          q3: How do I judge a seller?
          a3: Their store page shows average rating, completed sales and whether they hold the verified badge. New accounts deserve extra caution.
        selling:
          q1: How long does listing approval take?
          a1: Most listings are reviewed within one business day. You get an e-mail when the listing goes live — or the reason if it does not pass.
          q2: When do I get paid?
          a2: Funds settle shortly after the buyer confirms delivery; verified sellers settle faster. The sale detail in your dashboard shows the exact state.
          q3: Can I cancel a sale?
          a3: Only before you ship. Once the parcel is on its way, cancellations go through the dispute flow so the buyer stays protected.
        payments:
          q1: Which payment methods work?
          a1: Card payments are processed at checkout. Where direct settlement is enabled, the order page explains how buyer and seller complete it.
          q2: Are my card details stored?
          a2: Never. Card data is handled by our payment provider; PCMarket keeps only the transaction record.
          q3: When is my card charged?
          a3: At checkout. On protected orders, funds reach the seller only after delivery is confirmed.
        shipping:
          q1: Who pays for shipping?
          a1: The buyer, as shown at checkout. Sellers can also offer free shipping or in-person pickup.
          q2: How do I track my order?
          a2: Each order has a status page in your account, and sellers attach a tracking reference when they ship.
          q3: What if the parcel arrives damaged?
          a3: Photograph it, note the damage with the carrier if possible, and open a dispute within 48 hours — damage claims move fastest.
        account:
          q1: How do I change my password?
          a1: In account settings under Security. Use "Forgot password" if you cannot sign in.
          q2: Can I delete my account?
          a2: Yes — account settings includes data deletion with a short grace period before it becomes final.
          q3: Can I export my data?
          a3: One click in account settings produces a machine-readable copy of your listings, orders and messages.
      still_lost:
        title: Still stuck?
        text: A human reads every message — with an order number, even faster.
        cta: Contact us
    seller_guides:
      title: Seller guides
      lede: The playbook our best-rated sellers follow. Six short guides.
      guides:
        photos:
          title: Photograph the item you actually sell
          text: Natural light, at least four angles, plus close-ups of ports, labels and any fault. Keep the serial label readable.
          bullets:
            a: Shoot the actual item — never a stock photo.
            b: Show the accessories and cables you will really include.
            c: Photograph faults up close; honesty turns browsers into buyers.
        titles:
          title: Write titles that match searches
          text: Buyers type real model numbers, not "awesome graphics card". Brand, model, capacity and condition belong in the title.
          bullets:
            a: 'Model number first: "NVIDIA RTX 3070 8GB".'
            b: 'State the condition: new, refurbished or used.'
            c: Skip ALL-CAPS and emoji — they erode trust.
        specs:
          title: Fill in every spec field
          text: Structured specs power filters and compatibility checks. A missing socket or chipset hides your listing from most searches.
          bullets:
            a: Complete the structured spec panel, not just the description.
            b: Include capacity, generation and interface where they apply.
            c: Add hours used for GPUs and consoles — buyers ask anyway.
        pricing:
          title: Price from sold comparables
          text: The market shows what comparable listings sold for. Price slightly under them for a fast sale, above them if you can wait.
          bullets:
            a: Check recently sold listings before setting the price.
            b: Factor shipping into your bottom line before discounting.
            c: A firm price beats a bargain followed by endless lowball chats.
        shipping:
          title: Pack like the part matters — it does
          text: Anti-static bag, rigid box, generous padding on every face. Graphics cards and motherboards bend in transit without stiffeners.
          bullets:
            a: Never ship a GPU loose in an envelope.
            b: Keep the carrier receipt until delivery is confirmed.
            c: Attach the tracking reference on the order page immediately.
        after:
          title: After the sale
          text: Ship within one business day, attach tracking, and answer chat politely and fast. Smooth sales are what raise conversion on the next one.
          bullets:
            a: A shipped today beats a cheaper listing shipped Monday.
            b: Thank the buyer — reviews are a two-way street.
            c: If something goes wrong, message first; disputes last.
      cta:
        title: Put these into practice
        subtitle: A guide-conformant listing passes review on the first try almost every time.
        list: Create a listing
        selling: Selling overview
