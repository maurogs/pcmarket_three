        title: Ready when you are
        subtitle: Creating an account is free and listing takes minutes.
        start: Create a listing
        trade_in: Or sell the whole machine to us
    contact:
      title: Contact us
      lede: A question about an order, a listing or the platform itself? This reaches a human.
