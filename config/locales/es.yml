    help:
      title: Centro de ayuda
      lede: Respuestas breves a las preguntas más frecuentes. Busca o rebusca por tema.
      search_label: Buscar temas de ayuda
      search_placeholder: Escribe una palabra, como «reembolso» o «envío»
      no_results: 'Nada coincide con esa búsqueda: prueba otra palabra o escríbenos.'
      groups:
        buying: Comprar
        selling: Vender
        payments: Pagos
        shipping: Envíos
        account: Cuenta
      faq:
        buying:
          q1: ¿Cómo sé si una pieza es compatible?
          a1: 'Cada anuncio publica especificaciones estructuradas: zócalo, chipset, capacidad, formato. Los filtros las respetan y los PCs gamer llevan nota de compatibilidad.'
          q2: ¿Puedo negociar el precio?
          a2: 'Muchos vendedores aceptan ofertas: si el anuncio muestra el botón «Haz una oferta», manda una y el vendedor puede aceptar, rechazar o contraofrecer en el chat.'
          q3: ¿Cómo juzgo a un vendedor?
          a3: Su tienda muestra valoración media, ventas completadas y si tiene el sello de verificado. Con cuentas nuevas, más precaución.
        selling:
          q1: ¿Cuánto tarda la aprobación de un anuncio?
          a1: La mayoría se revisan en un día laborable. Recibes un correo cuando el anuncio se publica, o el motivo si no pasa.
          q2: ¿Cuándo cobro?
          a2: El importe se libera poco después de que el comprador confirme la entrega; los verificados cobran antes. El detalle de la venta en tu panel muestra el estado exacto.
          q3: ¿Puedo cancelar una venta?
          a3: Solo antes de enviar. Con el paquete en ruta, la cancelación pasa por la disputa para proteger al comprador.
        payments:
          q1: ¿Qué métodos de pago funcionan?
          a1: El pago con tarjeta se procesa en el checkout. Donde está activo el abono directo, la página del pedido explica cómo lo rematan comprador y vendedor.
          q2: ¿Guardáis los datos de mi tarjeta?
          a2: Nunca. Los gestiona nuestro proveedor de pago; PCMarket guarda solo el registro de la transacción.
          q3: ¿Cuándo se cobra a mi tarjeta?
          a3: En el checkout. En pedidos protegidos, el vendedor recibe el importe solo al confirmarse la entrega.
        shipping:
          q1: ¿Quién paga el envío?
          a1: El comprador, como se muestra en el checkout. Los vendedores también pueden ofrecer envío gratis o entrega en mano.
          q2: ¿Cómo sigo mi pedido?
          a2: Cada pedido tiene una página de estado en tu cuenta, y el vendedor añade referencia de seguimiento al enviar.
          q3: ¿Y si el paquete llega dañado?
          a3: 'Fotografia el daño, anótalo ante el transportista si puedes y abre una disputa en 48 horas: los daños son lo que más rápido se resuelve.'
        account:
          q1: ¿Cómo cambio mi contraseña?
          a1: En ajustes de cuenta, sección Seguridad. Usa «He olvidado mi contraseña» si no puedes entrar.
          q2: ¿Puedo borrar mi cuenta?
          a2: 'Sí: los ajustes de cuenta incluyen la supresión de datos, con un breve periodo de gracia antes de que sea definitiva.'
          q3: ¿Puedo exportar mis datos?
          a3: Un clic en ajustes de cuenta genera una copia legible por máquina de tus anuncios, pedidos y mensajes.
      still_lost:
        title: ¿Sigues atascado?
        text: Una persona lee cada mensaje; con número de pedido, aún más rápido.
        cta: Escríbenos
    seller_guides:
      title: Guías para vendedores
      lede: El método que siguen nuestros mejores vendedores. Seis guías breves.
      guides:
        photos:
          title: Fotografia lo que de verdad vendes
          text: Luz natural, cuatro ángulos como mínimo y primeros planos de puertos, etiquetas y defectos. Deja legible la etiqueta de número de serie.
          bullets:
            a: Dispara al artículo real, nunca una foto de catálogo.
            b: Enseña los accesorios y cables que incluirás de verdad.
            c: 'Fotografia los defectos de cerca: la honestidad convierte curiosos en compradores.'
        titles:
          title: Escribe títulos que coincidan con las búsquedas
          text: Los compradores teclean números de modelo reales, no «gráfica chulísima». Marca, modelo, capacidad y estado van en el título.
          bullets:
            a: 'Primero el modelo: «NVIDIA RTX 3070 8GB».'
            b: 'Indica el estado: nuevo, reacondicionado o usado.'
            c: 'Evita MAYÚSCULAS y emojis: restan confianza.'
        specs:
          title: Rellena cada campo de especificación
          text: Las especificaciones estructuradas alimentan filtros y comprobaciones de compatibilidad. Un zócalo o chipset ausente esconde tu anuncio de casi todas las búsquedas.
          bullets:
            a: Completa el panel de especificaciones, no solo la descripción.
            b: Incluye capacidad, generación e interfaz cuando apliquen.
            c: 'Añade las horas de uso en gráficas y consolas: te las preguntarán igual.'
        pricing:
          title: Ponte precio con comparables vendidos
          text: El mercado muestra a qué se vendieron anuncios comparables. Por debajo, venta rápida; por encima, si puedes esperar.
          bullets:
            a: Mira anuncios vendidos recientes antes de fijar precio.
            b: Descuenta el envío de tu mínimo antes de rebajar.
            c: Un precio firme gana a un chollo con infinitas conversaciones a la baja.
        shipping:
          title: 'Embala como si la pieza importara: importa'
          text: Bolsa antiestática, caja rígida y mullido generoso en cada cara. Las gráficas y placas se doblan en tránsito sin refuerzos.
          bullets:
            a: Nunca envíes una gráfica suelta en un sobre.
            b: Guarda el resguardo del transportista hasta confirmarse la entrega.
            c: Añade la referencia de seguimiento en la página del pedido al instante.
        after:
          title: Después de la venta
          text: Envía en un día laborable, añade seguimiento y contesta al chat con rapidez y educación. Las ventas fluidas suben la conversión de la siguiente.
          bullets:
            a: Un «enviado hoy» gana a un anuncio más barato enviado el lunes.
            b: 'Agradece al comprador: las reseñas van en ambas direcciones.'
            c: Si algo va mal, mensaje primero; disputa al final.
      cta:
        title: Llévalos a la práctica
        subtitle: Un anuncio conforme a las guías pasa la revisión a la primera casi siempre.
        list: Crear un anuncio
        selling: Resumen para vender
