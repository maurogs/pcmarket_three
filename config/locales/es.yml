        direct_tip_a: 'Mantén todas las conversaciones en el chat de PCMarket: es tu prueba.'
        direct_tip_b: Realiza el pago a través del flujo del pedido, nunca por transferencia a la cuenta personal de un desconocido.
        direct_tip_c: Revisa la valoración, las ventas completadas y el sello de verificado del vendedor antes de comprometerte.
        direct_tip_d: Confirma la entrega una sola vez, y solo cuando el paquete esté físicamente en tus manos.
      covered:
        title: Qué está cubierto
        items:
          a: Reembolso completo si tu artículo nunca llega.
          b: Reembolso completo si el artículo difiere sensiblemente del anuncio.
          c: Reembolsos parciales por diferencias menores, acordados en la disputa.
          d: Protección desde que pagas hasta que se confirma la entrega.
          e: Un flujo de disputa estructurado en el que un moderador revisa cada caso.
          f: 'Registro transparente: cada paso del pedido queda sellado con fecha y hora.'
        fine_print: La protección se aplica a los pedidos realizados a través de PCMarket. Abusar de los reembolsos puede suspender tu cuenta.
      safeguards:
        title: Cómo mantenemos limpio el mercado
        review:
          title: Todos los anuncios se revisan
          text: Los anuncios nuevos pasan por una cola de moderación antes de publicarse. Los moderadores comprueban fotos, descripción y categoría antes de aprobarlos.
        verified:
          title: Busca el sello de verificación
          text: Los vendedores pueden obtener un sello de verificación confirmando su identidad y acumulando ventas completadas.
        reporting:
          title: Denuncia lo que huela raro
          text: Cualquiera puede denunciar un anuncio con un clic. Varias denuncias abiertas devuelven el anuncio a la cola de revisión.
        chat:
          title: Mantén los chats en la plataforma
          text: En una disputa, los moderadores leen el chat de PCMarket entre comprador y vendedor. Si te quedas en el chat, tu prueba es válida.
      support:
        title: ¿Necesitas ayuda?
        email_title: Correo electrónico
        email_hint: Respondemos en un día laborable.
        phone_title: Teléfono
        phone_hint: En horario laboral de lunes a viernes.
        contact_title: Formulario de contacto
        contact_hint: Cuéntanos qué ha pasado e incluye el número de pedido si lo tienes.
        contact_cta: Ir al formulario de contacto
      faq:
        title: Preguntas frecuentes
        q1: ¿El vendedor cobra directamente mi pago?
        a1: Todos los pedidos pasan primero por nuestro pago. Donde está activo el pago con tarjeta, los fondos se liberan al vendedor solo al confirmar la entrega; el pago directo se explica siempre en la página del pedido.
        q2: ¿Y si el artículo nunca llega?
        a2: Abre una disputa desde la página del pedido. Cuando el seguimiento no muestra entrega, te reembolsamos el importe completo.
        q3: ¿Puedo devolver algo por cambio de opinión?
        a3: 'Las compras a vendedores profesionales tienen el derecho legal de desistimiento de 14 días. Las ventas entre particulares siguen la política de devoluciones que el vendedor indique en el anuncio: compruébala siempre primero.'
        q4: ¿Cómo sé si un vendedor es de fiar?
        a4: 'Mira su valoración, sus ventas completadas y el sello de verificado. Una cuenta nueva sin reseñas merece precaución extra: empieza con un pedido pequeño.'
        q5: ¿Qué pasa cuando denuncio un anuncio?
        a5: Un moderador lo revisa. Con tres denuncias abiertas, cualquier anuncio publicado vuelve automáticamente a la cola de revisión, y los vendedores que incumplen las reglas reciben sanciones.
        q6: ¿Leéis mis chats?
        a6: Los chats son privados. En una disputa, los moderadores pueden leer la conversación entre comprador y vendedor para decidir con criterio.
      cta:
        title: ¿Listo para comprar con tranquilidad?
        subtitle: Explora anuncios cubiertos por la protección al comprador de PCMarket.
        browse: Ver anuncios
        how_it_works: Ver cómo funciona
      legal_intro: 'También puedes leer:'
