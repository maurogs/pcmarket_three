    selling:
      title: Vende en PCMarket
      lede: Tu gráfica de repuesto es la mejora de otra persona. Anúnciala en minutos y cobra cuando envíe.
      steps:
        title: Cuatro pasos hasta tu primera venta
        create:
          title: Crea un gran anuncio
          text: Fotos del artículo real, un estado honesto y, sobre todo, la lista completa de especificaciones. Las especificaciones estructuradas son lo que hace clic a los compradores.
        review:
          title: Pasa una revisión rápida
          text: Un moderador revisa el anuncio antes de publicarlo. La mayoría se aprueban en un día laborable.
        sell:
          title: Chatea, reserva y envía
          text: Responde preguntas, acepta ofertas si te convencen y envía con seguimiento. La página del pedido te guía en cada paso.
        get_paid:
          title: Cobra
          text: El importe se libera cuando el comprador confirma la entrega. Los vendedores verificados cobran antes.
      fees:
        title: Comisiones
        pct: PCMarket aplica una comisión del %{percent}% sobre las ventas completadas.
        zero: 'Comisión cero durante el periodo de lanzamiento de PCMarket: te quedas el 100% de cada venta.'
        note: Publicar es gratis. Solo se cobra cuando una venta se completa.
      tips:
        title: Consejos de nuestros mejores vendedores
        items:
          a: 'Fotografia el artículo en sí: las fotos de catálogo se saltan.'
          b: 'Incluye las especificaciones que se buscan: zócalo, chipset, capacidad, horas de uso.'
          c: Ponte precio con comparables ya vendidos, no con esperanzas.
          d: 'Envía en un día laborable: la rapidez es el motor número uno de reseñas.'
          e: 'Responde rápido al chat: contestar tarde cuesta ventas.'
          f: 'Sé honesto con los defectos: un defecto descrito gana a una devolución sorpresa.'
      requirements:
        title: Antes de publicar
        items:
          a: El artículo debe ser tuyo y legal en tu país.
          b: 'Los artículos prohibidos (falsificaciones, piezas inseguras) se retiran: lee antes las reglas.'
          c: Hay que ser mayor de 18 años o vender con consentimiento paterno.
          d: Las obligaciones de envío y desistimiento cambian si vendes como empresa o como particular.
