    about:
      title: Sobre PCMarket
      lede: 'PCMarket es el mercado dedicado al hardware de PC en nuestro mercado: nuevo y de segunda mano, hecho por gente que monta PCs.'
      cards:
        mission:
          title: Una categoría, bien hecha
          text: Los mercados generalistas entierran el hardware entre ruido. Nosotros apostamos por especificaciones, zócalos y compatibilidad.
        wide:
          title: Nuevo y de segunda mano juntos
          text: 'Amantes de las mejoras, tiendas de reparación y aficionados comparten catálogo: todos los anuncios son bienvenidos si son honestos.'
        fair:
          title: Justo para ambas partes
          text: Protección clara para compradores, reglas claras y cobros rápidos para vendedores.
      story:
        title: Por qué empezamos
        p1: 'Quien haya buscado una gráfica compatible, un zócalo de CPU o un panel de portátil conoce el dolor: la mitad de los anuncios omiten la única especificación que decide la compatibilidad, y nadie protege la transacción.'
        p2: PCMarket resuelve ambos problemas. Especificaciones estructuradas en cada anuncio, moderación humana antes de publicar y protección al comprador en cada pedido.
      values:
        title: Lo que no negociamos
        items:
          a: Anuncios honestos, garantizados por moderadores reales, no solo bots.
          b: Soporte rápido y humano.
          c: 'Reglas transparentes: léelas, son breves.'
          d: 'Privacidad por defecto: solo los datos que una venta necesita de verdad.'
      promise:
        title: Nuestra promesa
        text: Todos los pedidos de PCMarket están protegidos. Si algo va mal, lo arreglamos.
        trust_cta: Cómo te protegemos
        contact_cta: Habla con nosotros
