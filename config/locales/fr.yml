    help:
      title: Centre d'aide
      lede: Des réponses courtes aux questions les plus fréquentes. Cherchez, ou fouillez un thème.
      search_label: Rechercher dans l'aide
      search_placeholder: Tapez un mot, comme « remboursement » ou « livraison »
      no_results: Rien ne correspond à cette recherche — essayez un autre mot ou contactez-nous.
      groups:
        buying: Acheter
        selling: Vendre
        payments: Paiements
        shipping: Livraisons
        account: Compte
      faq:
        buying:
          q1: Comment savoir si une pièce est compatible ?
          a1: Chaque annonce publie des caractéristiques structurées — socket, chipset, capacité, format. Les filtres les respectent et les PC gamer portent une note de compatibilité.
          q2: Puis-je négocier le prix ?
          a2: 'Beaucoup de vendeurs acceptent les offres : si l''annonce affiche le bouton « Faire une offre », envoyez-en une ; le vendeur peut accepter, refuser ou contre-offrir dans le chat.'
          q3: Comment jauger un vendeur ?
          a3: Sa boutique affiche la note moyenne, les ventes terminées et le badge vérifié. Avec un compte récent, redoublez de prudence.
        selling:
          q1: Combien de temps prend la validation d'une annonce ?
          a1: La plupart sont examinées sous un jour ouvré. Vous recevez un e-mail à la publication — ou le motif si l'annonce est refusée.
          q2: Quand suis-je payé ?
          a2: Les fonds sont versés peu après la confirmation de livraison par l'acheteur ; les vendeurs vérifiés plus vite. Le détail de la vente dans votre tableau de bord montre l'état exact.
          q3: Puis-je annuler une vente ?
          a3: Seulement avant l'expédition. Une fois le colis en route, l'annulation passe par le litige pour protéger l'acheteur.
        payments:
          q1: Quels moyens de paiement fonctionnent ?
          a1: Le paiement par carte est traité au checkout. Là où le règlement direct est activé, la page de commande explique comment acheteur et vendeur le finalisent.
          q2: Mes données de carte sont-elles stockées ?
          a2: Jamais. Elles sont gérées par notre prestataire de paiement ; PCMarket ne conserve que l'enregistrement de la transaction.
          q3: Quand ma carte est-elle débitée ?
          a3: Au checkout. Sur les commandes protégées, le vendeur ne reçoit les fonds qu'après confirmation de la livraison.
        shipping:
          q1: Qui paie la livraison ?
          a1: L'acheteur, comme indiqué au checkout. Les vendeurs peuvent aussi proposer la gratuité ou la remise en main propre.
          q2: Comment suivre ma commande ?
          a2: Chaque commande a une page de statut dans votre compte, et le vendeur ajoute une référence de suivi à l'expédition.
          q3: Et si le colis arrive endommagé ?
          a3: Photographiez le dommage, signalez-le au transporteur si possible et ouvrez un litige sous 48 heures — les litiges de dommage sont traités le plus vite.
        account:
          q1: Comment changer mon mot de passe ?
          a1: Dans les paramètres du compte, section Sécurité. Utilisez « Mot de passe oublié » si vous ne pouvez pas vous connecter.
          q2: Puis-je supprimer mon compte ?
          a2: Oui — les paramètres du compte prévoient la suppression des données, avec un court délai de grâce avant qu'elle devienne définitive.
          q3: Puis-je exporter mes données ?
          a3: Un clic dans les paramètres du compte produit une copie lisible par machine de vos annonces, commandes et messages.
      still_lost:
        title: Toujours bloqué ?
        text: Un humain lit chaque message — avec un numéro de commande, c'est encore plus rapide.
        cta: Écrivez-nous
    seller_guides:
      title: Guides du vendeur
      lede: La méthode de nos mieux notés. Six guides courts.
      guides:
        photos:
          title: Photographiez ce que vous vendez vraiment
          text: Lumière naturelle, quatre angles minimum, gros plans des ports, étiquettes et défauts. Laissez l'étiquette de numéro de série lisible.
          bullets:
            a: Photographiez l'objet réel — jamais une photo catalogue.
            b: Montrez les accessoires et câbles réellement inclus.
            c: 'Photographiez les défauts de près : l''honnêteté convertit les curieux en acheteurs.'
        titles:
          title: Écrivez des titres qui matchent les recherches
          text: Les acheteurs tapent de vrais numéros de modèle, pas « super carte graphique ». Marque, modèle, capacité et état vont dans le titre.
          bullets:
            a: 'Le modèle d''abord : « NVIDIA RTX 3070 8GB ».'
            b: 'Indiquez l''état : neuf, reconditionné ou d''occasion.'
            c: Évitez les MAJUSCULES et les émojis — ils érodent la confiance.
        specs:
          title: Remplissez chaque champ de caractéristique
          text: Les caractéristiques structurées alimentent les filtres et les contrôles de compatibilité. Un socket ou chipset manquant cache votre annonce de la plupart des recherches.
          bullets:
            a: Complétez le panneau structuré, pas seulement la description.
            b: Indiquez capacité, génération et interface quand c'est pertinent.
            c: Ajoutez les heures d'usage pour GPU et consoles — on vous le demandera quand même.
        pricing:
          title: Prix d'après les ventes comparables
          text: Le marché montre à quel prix se sont vendues les annonces comparables. En dessous pour vendre vite, au-dessus si vous pouvez attendre.
          bullets:
            a: Consultez les annonces récemment vendues avant de fixer le prix.
            b: Déduisez la livraison de votre plancher avant de baisser.
            c: Un prix ferme bat une bonne affaire suivie de interminables négociations à la baisse.
        shipping:
          title: Emballez comme si la pièce comptait — elle compte
          text: Sac antistatique, boîte rigide, calage généreux sur chaque face. Les cartes graphiques et les cartes mères se plient en transit sans renfort.
          bullets:
            a: N'envoyez jamais un GPU en vrac dans une enveloppe.
            b: Gardez le récépissé du transporteur jusqu'à la confirmation de livraison.
            c: Ajoutez la référence de suivi sur la page de commande immédiatement.
        after:
          title: Après la vente
          text: Expédiez sous un jour ouvré, ajoutez le suivi, répondez au chat poliment et vite. Les ventes fluides augmentent la conversion de la suivante.
          bullets:
            a: Un « expédié aujourd'hui » bat une annonce moins chère expédiée lundi.
            b: Remerciez l'acheteur — les avis vont dans les deux sens.
            c: En cas de pépin, message d'abord ; litige en dernier recours.
      cta:
        title: Passez à la pratique
        subtitle: Une annonce conforme aux guides passe la vérification du premier coup presque toujours.
        list: Créer une annonce
        selling: Panorama de la vente
