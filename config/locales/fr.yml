      lede: Votre carte graphique de secours fait le bonheur d'un upgrade. Publiez-la en quelques minutes et soyez payé à l'expédition.
      steps:
        title: Quatre étapes vers votre première vente
        create:
          title: Créer une annonce exemplaire
          text: Photos de l'objet réel, état honnête et surtout la liste complète des caractéristiques. Ce sont elles qui font cliquer les acheteurs.
        review:
          title: Passer une vérification rapide
          text: Un modérateur contrôle l'annonce avant publication. La plupart passent sous un jour ouvré.
        sell:
          title: Discuter, réserver, expédier
          text: Répondez aux questions, acceptez les offres qui vous conviennent, expédiez avec suivi. La page de commande vous guide à chaque étape.
        get_paid:
          title: Être payé
          text: Les fonds sont versés après confirmation de la livraison par l'acheteur. Les vendeurs vérifiés sont payés plus vite.
      fees:
        title: Commissions
        pct: PCMarket prélève une commission de %{percent}% sur les ventes terminées.
        zero: 'Commission zéro pendant la période de lancement de PCMarket : vous gardez 100 % de chaque vente.'
        note: Publier est gratuit. Vous n'êtes facturés qu'à la fin d'une vente.
      tips:
        title: Les conseils de nos meilleurs vendeurs
        items:
          a: Photographiez l'objet lui-même — les photos catalogue passent à la trappe.
          b: 'Indiquez les caractéristiques recherchées : socket, chipset, capacité, heures d''usage.'
          c: Fixez le prix d'après les ventes comparables, pas d'après l'espoir.
          d: Expédiez sous un jour ouvré — la rapidité est le premier moteur des bons avis.
          e: 'Répondez vite au chat : une réponse lente coûte des ventes.'
          f: 'Soyez honnête sur les défauts : un défaut décrit vaut mieux qu''un retour surprise.'
      requirements:
        title: Avant de publier
        items:
          a: L'article doit vous appartenir et être légal dans votre pays.
          b: Les articles interdits (contrefaçons, pièces dangereuses) sont retirés — lisez d'abord les règles.
          c: Il faut avoir 18 ans ou vendre avec le consentement parental.
          d: Les obligations d'expédition et de retour changent selon que vous vendez en professionnel ou en particulier.
        guides_link: Guides du vendeur
        terms_link: Conditions d'utilisation
