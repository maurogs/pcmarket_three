    about:
      title: À propos de PCMarket
      lede: PCMarket est la plateforme dédiée au matériel informatique dans notre marché — neuf et d'occasion, conçue par des gens qui montent des PC.
      cards:
        mission:
          title: Une catégorie, bien faite
          text: Les plateformes généralistes noient le matériel dans le bruit. Nous misons sur les fiches techniques, les sockets et la compatibilité.
        wide:
          title: Neuf et occasion côte à côte
          text: 'Upgradeurs, ateliers de réparation et passionnés partagent le même catalogue : toute annonce honnête est bienvenue.'
        fair:
          title: Équitable pour les deux camps
          text: Une protection claire pour les acheteurs, des règles claires et des paiements rapides pour les vendeurs.
      story:
        title: Pourquoi nous avons commencé
        p1: 'Chercher une carte graphique compatible, un socket de CPU ou une dalle de portable est un calvaire : la moitié des annonces omettent la seule caractéristique qui décide de la compatibilité, et personne ne protège la transaction.'
        p2: PCMarket règle ces deux problèmes. Des caractéristiques structurées sur chaque annonce, une modération humaine avant publication et une protection de l'acheteur sur chaque commande.
      values:
        title: Ce qui n'est pas négociable
        items:
          a: Des annonces honnêtes, garanties par de vrais modérateurs, pas seulement des robots.
          b: Un support rapide et humain.
          c: 'Des règles transparentes : lisez-les, elles sont courtes.'
          d: La vie privée par défaut — seulement les données qu'une vente exige vraiment.
      promise:
        title: Notre promesse
        text: Chaque commande sur PCMarket est protégée. Si quelque chose tourne mal, nous arrangeons.
        trust_cta: Comment nous vous protégeons
        contact_cta: Parlons-en
