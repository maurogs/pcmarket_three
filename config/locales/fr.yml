        badge: Protection de l'acheteur
        open_policy_badge: Notre politique de protection est publique
      stats:
        completed_orders: Commandes terminées
        verified_sellers: Vendeurs vérifiés
        reviewed_listings: Annonces vérifiées
      protection:
        title: Comment fonctionne la protection de l'acheteur
        subtitle: Trois étapes simples, du paiement à la livraison.
        one:
          title: Réservez en confiance
          text: 'Passer commande bloque le stock : l''annonce est réservée dès le paiement, personne ne peut acheter ce que vous venez de commander.'
        two:
          title: Payez le montant convenu
          text: 'Vous payez exactement le prix affiché au paiement. Pas de frais cachés, pas de surprise : ce que vous voyez est ce que le vendeur reçoit.'
        three:
          title: Recevez ou soyez remboursé
          text: 'Si l''article n''arrive jamais ou ne correspond pas à l''annonce, ouvrez un litige : nos modérateurs tranchent et remboursent si vous avez raison.'
        direct_notice: 'Pour l''instant, le paiement se règle directement entre acheteur et vendeur sur la page de commande. Suivez ces conseils pour rester protégé :'
        direct_tip_a: 'Gardez toutes les conversations dans le chat PCMarket : c''est votre preuve.'
        direct_tip_b: Réglez via le parcours de commande, jamais par virement sur le compte personnel d'un inconnu.
        direct_tip_c: Vérifiez la note, les ventes terminées et le badge vérifié du vendeur avant de vous engager.
        direct_tip_d: Confirmez la livraison une seule fois, et seulement quand le colis est physiquement entre vos mains.
      covered:
        title: Ce qui est couvert
        items:
          a: Remboursement intégral si votre article n'arrive jamais.
          b: Remboursement intégral si l'article diffère sensiblement de l'annonce.
          c: Remboursements partiels pour les écarts mineurs, convenus dans le litige.
          d: Protection du paiement jusqu'à la confirmation de la livraison.
          e: Un parcours de litige structuré où un modérateur examine chaque cas.
          f: 'Un historique transparent : chaque étape de la commande est horodatée.'
        fine_print: La protection s'applique aux commandes passées via PCMarket. Abuser des remboursements peut suspendre votre compte.
      safeguards:
        title: Comment nous gardons la plateforme propre
        review:
          title: Chaque annonce est vérifiée
          text: Les nouvelles annonces passent dans une file de modération avant publication. Les modérateurs contrôlent photos, description et catégorie.
        verified:
          title: Cherche le badge de vérification
          text: Les vendeurs peuvent obtenir un badge de vérification en confirmant leur identité et en accumulant des ventes terminées.
        reporting:
          title: Signalez tout ce qui cloche
          text: N'importe qui peut signaler une annonce en un clic. Assez de signalements ouverts et l'annonce retourne dans la file de vérification.
        chat:
          title: Gardez les échanges sur la plateforme
          text: En cas de litige, les modérateurs lisent le chat PCMarket entre acheteur et vendeur. Rester dans le chat préserve votre preuve.
      support:
        title: Besoin d'un coup de main ?
        email_title: E-mail
        email_hint: Nous répondons sous un jour ouvré.
        phone_title: Téléphone
        phone_hint: Aux heures ouvrées, en semaine.
        contact_title: Formulaire de contact
        contact_hint: Expliquez ce qui s'est passé et joignez le numéro de commande si vous l'avez.
        contact_cta: Aller au formulaire de contact
      faq:
        title: Questions fréquentes
        q1: Le vendeur encaisse-t-il directement mon paiement ?
        a1: Toutes les commandes passent d'abord par notre paiement. Là où le paiement par carte est activé, les fonds ne sont versés au vendeur qu'après confirmation de la livraison ; le règlement direct est toujours expliqué sur la page de commande.
        q2: Et si l'article n'arrive jamais ?
        a2: Ouvrez un litige depuis la page de commande. Quand le suivi n'affiche aucune livraison, vous êtes remboursé intégralement.
        q3: Puis-je retourner un article par simple changement d'avis ?
        a3: 'Les achats auprès de vendeurs professionnels bénéficient du délai légal de rétractation de 14 jours. Entre particuliers, la politique de retour indiquée dans l''annonce s''applique : vérifiez-la d''abord.'
        q4: Comment savoir si un vendeur est fiable ?
        a4: 'Regardez sa note, ses ventes terminées et son badge vérifié. Un compte récent sans avis mérite une prudence supplémentaire : commencez par une petite commande.'
        q5: Que se passe-t-il quand je signale une annonce ?
        a5: Un modérateur l'examine. Trois signalements ouverts renvoient automatiquement n'importe quelle annonce en ligne dans la file de vérification, et les vendeurs qui enfreignent les règles sont sanctionnés.
        q6: Lisez-vous mes chats ?
        a6: Les chats sont privés. En cas de litige, les modérateurs peuvent lire la conversation entre acheteur et vendeur pour trancher en connaissance de cause.
      cta:
        title: Prêt à acheter l'esprit tranquille ?
        subtitle: Parcourez les annonces couvertes par la protection de l'acheteur PCMarket.
