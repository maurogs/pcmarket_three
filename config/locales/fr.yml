          text: Suivez la commande, confirmez la livraison, laissez un avis. Si un doute subsiste, ouvrez un litige avant de confirmer.
        escrow_note: Le paiement par carte est capté par notre prestataire et versé au vendeur une fois la livraison confirmée.
        direct_note: Après le paiement, le règlement et la livraison s'organisent sur la page de commande. Réglez toujours via PCMarket et gardez la conversation dans le chat.
