          text: Filtra per socket, chipset, capacità, condizioni e altro. Le specifiche sono strutturate in ogni annuncio, quindi i filtri funzionano davvero.
        series:
          title: Serie curate
          text: Sfoglia raccolte curate dei migliori componenti per fascia.
        pc_finder:
          title: Quiz PC Finder
          text: Non sai cosa ti serve? Rispondi a qualche domanda e ti suggeriamo PC da gaming pronti all'acquisto.
      buy:
        title: Compra in sicurezza
        reserve:
          title: Prenota l'articolo
          text: Ordinare blocca la disponibilità — l'annuncio è riservato nell'istante in cui completi l'acquisto.
        pay:
          title: Paga al checkout
          text: Un checkout, un totale chiaro. I dati della carta sono elaborati dal nostro gestore dei pagamenti e mai salvati da noi.
        receive:
          title: Ricevi e conferma
          text: Traccia l'ordine, conferma la consegna, lascia una recensione. Se qualcosa non va, apri una controversia prima di confermare.
        escrow_note: I pagamenti con carta sono incassati dal nostro gestore dei pagamenti e rilasciati al venditore quando confermi la consegna.
        direct_note: Dopo il checkout, pagamento e consegna si concordano sulla pagina dell'ordine. Regola sempre tramite PCMarket e tieni la conversazione in chat.
        trust_link: Leggi la guida completa alla protezione acquirenti.
      pay:
        title: Un unico totale chiaro
        items:
          methods: Paga con carta, o regola direttamente dove questa modalità è abilitata.
          hold: L'annuncio viene riservato per te nell'istante in cui ordini.
          receipt: Ogni ordine ha un registro dettagliato che puoi rivedere in qualsiasi momento.
      more:
