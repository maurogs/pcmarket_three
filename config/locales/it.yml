        hours_title: Orari di assistenza
        hours_text: Dal lunedì al venerdì, 9:00–18:00. Gli ordini continuano a muoversi h24.
    help:
      title: Centro di assistenza
      lede: Risposte brevi alle domande più frequenti. Cerca, oppure scorri un argomento.
      search_label: Cerca argomenti di aiuto
      search_placeholder: Scrivi una parola, tipo "rimborso" o "spedizione"
      no_results: Nulla corrisponde a questa ricerca — prova un'altra parola o contattaci.
      groups:
        buying: Acquisto
        selling: Vendita
        payments: Pagamenti
        shipping: Spedizione
        account: Account
      faq:
        buying:
          q1: Come faccio a sapere se un componente è compatibile?
          a1: Ogni annuncio pubblica specifiche strutturate — socket, chipset, capacità, fattore di forma. I filtri le rispettano, e i PC da gaming riportano una nota di compatibilità.
          q2: Posso trattare sul prezzo?
          a2: 'Molti venditori accettano offerte: se l''annuncio mostra un pulsante "Fai un''offerta", inviala e il venditore può accettare, rifiutare o contrattare in chat.'
          q3: Come giudico un venditore?
          a3: La sua pagina negozio mostra valutazione media, vendite completate e se possiede il badge di verifica. Gli account nuovi meritano prudenza in più.
        selling:
          q1: Quanto tempo richiede l'approvazione di un annuncio?
          a1: La maggior parte degli annunci viene verificata entro un giorno lavorativo. Ricevi un'e-mail quando l'annuncio va online — o il motivo se non passa.
          q2: Quando vengo pagato?
          a2: I fondi vengono regolati poco dopo la conferma di consegna da parte dell'acquirente; i venditori verificati vengono pagati prima. Il dettaglio della vendita nella dashboard mostra lo stato esatto.
          q3: Posso annullare una vendita?
          a3: Solo prima di spedire. Una volta che il pacco è in viaggio, le annullazioni passano dalla procedura di controversia così l'acquirente resta protetto.
        payments:
          q1: Quali metodi di pagamento funzionano?
          a1: I pagamenti con carta vengono elaborati al checkout. Dove la regolazione diretta è abilitata, la pagina dell'ordine spiega come acquirente e venditore la completano.
          q2: I dati della mia carta vengono salvati?
          a2: Mai. I dati della carta sono gestiti dal nostro gestore dei pagamenti; PCMarket conserva solo il record della transazione.
          q3: Quando viene addebitata la carta?
          a3: Al checkout. Sugli ordini protetti, i fondi raggiungono il venditore solo dopo la conferma della consegna.
        shipping:
          q1: Chi paga la spedizione?
          a1: L'acquirente, come indicato al checkout. I venditori possono anche offrire spedizione gratuita o ritiro a mano.
          q2: Come traccio il mio ordine?
          a2: Ogni ordine ha una pagina di stato nel tuo account, e i venditori allegano un riferimento di tracciamento quando spediscono.
          q3: E se il pacco arriva danneggiato?
          a3: Fotografarlo, segnalare il danno al corriere se possibile e aprire una controversia entro 48 ore — i reclami per danni si muovono più in fretta.
        account:
          q1: Come cambio la mia password?
          a1: Nelle impostazioni dell'account sotto Sicurezza. Usa "Password dimenticata" se non riesci ad accedere.
          q2: Posso eliminare il mio account?
          a2: Sì — le impostazioni dell'account includono la cancellazione dei dati con un breve periodo di grazia prima che diventi definitiva.
          q3: Posso esportare i miei dati?
          a3: Un clic nelle impostazioni dell'account produce una copia machine-readable dei tuoi annunci, ordini e messaggi.
      still_lost:
        title: Ancora bloccato?
        text: Una persona legge ogni messaggio — con un numero d'ordine, ancora più in fretta.
        cta: Contattaci
    seller_guides:
      title: Guida per venditori
      lede: Il manuale seguito dai nostri venditori meglio recensiti. Sei guide brevi.
      guides:
        photos:
          title: Fotografa l'articolo che vendi davvero
          text: Luce naturale, almeno quattro angolazioni, più primi piani di porte, etichette e eventuali difetti. Mantieni leggibile l'etichetta seriale.
          bullets:
            a: Scatta all'articolo reale — mai una foto stock.
            b: Mostra gli accessori e i cavi che includerai davvero.
            c: Fotografa i difetti da vicino; l'onestà trasforma i curiosi in acquirenti.
        titles:
          title: Scrivi titoli che corrispondono alle ricerche
          text: Gli acquirenti digitano veri numeri di modello, non "scheda video fantastica". Marca, modello, capacità e condizioni stanno nel titolo.
          bullets:
            a: 'Numero di modello per primo: "NVIDIA RTX 3070 8GB".'
            b: 'Indica le condizioni: nuovo, ricondizionato o usato.'
            c: Evita il MAIUSCOLO e le emoji — minano la fiducia.
        specs:
          title: Compila ogni campo di specifica
          text: Le specifiche strutturate alimentano filtri e controlli di compatibilità. Un socket o chipset mancante nasconde il tuo annuncio alla maggior parte delle ricerche.
          bullets:
            a: Completa il pannello di specifiche strutturate, non solo la descrizione.
            b: Inserisci capacità, generazione e interfaccia dove si applicano.
            c: Aggiungi le ore di utilizzo per GPU e console — gli acquirenti lo chiedono comunque.
        pricing:
          title: Prezza in base ai comparabili venduti
          text: Il mercato mostra a che prezzo sono stati venduti annunci comparabili. Prezzo leggermente sotto per una vendita veloce, sopra se puoi aspettare.
          bullets:
            a: Controlla gli annunci venduti di recente prima di fissare il prezzo.
            b: Considera la spedizione nel tuo margine prima di scontare.
            c: Un prezzo fermo batte un affare seguito da interminabili chat al ribasso.
        shipping:
          title: Imballa come se il componente contasse — conta
          text: Busta antistatica, scatola rigida, imbottitura generosa su ogni faccia. Schede video e motherboard si piegano in transito senza rinforzi.
          bullets:
            a: Non spedire mai una GPU sfusa in una busta.
            b: Conserva la ricevuta del corriere fino alla conferma della consegna.
            c: Allega subito il riferimento di tracciamento sulla pagina dell'ordine.
        after:
          title: Dopo la vendita
          text: Spedisci entro un giorno lavorativo, allega il tracciamento e rispondi in chat con educazione e velocità. Le vendite fluide sono ciò che alza la conversione sulla prossima.
          bullets:
            a: Uno spedito oggi batte un annuncio più economico spedito lunedì.
            b: Ringrazia l'acquirente — le recensioni funzionano in entrambe le direzioni.
            c: Se qualcosa va storto, scrivi prima; le controversie per ultime.
      cta:
        title: Mettili in pratica
        subtitle: Un annuncio conforme alla guida passa la verifica al primo tentativo quasi sempre.
        list: Crea un annuncio
        selling: Panoramica vendita
