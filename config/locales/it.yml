    about:
      title: Chi è PCMarket
      lede: PCMarket è il marketplace dedicato all'hardware PC nel nostro mercato — nuovo e usato, creato da persone che assemblano PC.
      cards:
        mission:
          title: Una categoria, fatta per bene
          text: I marketplace generalisti seppelliscono i componenti PC nel rumore. Noi puntiamo in profondità su specifiche, socket e compatibilità.
        wide:
          title: Nuovo e usato fianco a fianco
          text: Upgrade, negozi di riparazione e hobbisti condividono lo stesso catalogo — ogni tipo di annuncio è benvenuto purché sia onesto.
        fair:
          title: Equo per entrambe le parti
          text: Protezione chiara per gli acquirenti, regole chiare e pagamenti rapidi per i venditori.
      story:
        title: Perché abbiamo iniziato
        p1: 'Chiunque abbia cercato una scheda video compatibile, un socket CPU o un pannello per portatile conosce il problema: metà degli annunci omette proprio la specifica che decide la compatibilità, e nessuno protegge la transazione.'
        p2: PCMarket risolve entrambi i problemi. Specifiche strutturate in ogni annuncio, moderazione umana prima della pubblicazione e protezione acquirenti su ogni ordine.
      values:
        title: A cosa teniamo
        items:
          a: Annunci onesti — fatti rispettare da moderatori reali, non solo da bot.
          b: Assistenza rapida e umana.
          c: 'Regole trasparenti: leggile, sono brevi.'
          d: Privacy by default — solo i dati che una vendita realmente necessita.
      promise:
        title: La nostra promessa
        text: Ogni ordine su PCMarket è protetto. Se qualcosa va storto, lo risolviamo.
        trust_cta: Come ti proteggiamo
        contact_cta: Parla con noi
    how_it_works:
