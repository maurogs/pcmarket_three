    selling:
      title: Vendi su PCMarket
      lede: La tua scheda video di riserva è l'upgrade di qualcun altro. Pubblica l'annuncio in minuti e vieni pagato quando spedisci.
      steps:
        title: Quattro passi alla tua prima vendita
        create:
          title: Crea un ottimo annuncio
          text: Foto dell'articolo reale, condizioni oneste e — soprattutto — l'elenco completo delle specifiche. Sono le specifiche strutturate a far cliccare gli acquirenti.
        review:
          title: Supera una rapida verifica
          text: Un moderatore controlla l'annuncio prima che diventi pubblico. La maggior parte degli annunci passa entro un giorno lavorativo.
        sell:
          title: Chat, prenota, spedisci
          text: Rispondi alle domande, accetta le offerte se ti convincono, poi spedisci con tracciamento. La pagina dell'ordine ti guida in ogni passo.
        get_paid:
          title: Vieni pagato
          text: I fondi vengono regolati dopo che l'acquirente conferma la consegna. I venditori verificati vengono pagati prima.
      fees:
        title: Commissioni
        pct: PCMarket applica una commissione del %{percent}% sulle vendite completate.
        zero: Zero commissioni durante il periodo di lancio di PCMarket — tieni il 100% di ogni vendita.
        note: Pubblicare annunci è gratuito. Paghi solo quando una vendita si completa.
      tips:
        title: Consigli dai nostri migliori venditori
        items:
          a: Fotografa l'articolo stesso — le foto stock vengono scrollate via.
          b: 'Inserisci le specifiche che gli acquirenti cercano: socket, chipset, capacità, ore di utilizzo.'
          c: Prezza in base a comparabili venduti, non alle speranze.
          d: Spedisci entro un giorno lavorativo — la velocità è il primo fattore di recensione.
          e: Rispondi rapido in chat; le risposte lente costano vendite.
          f: Sii onesto sui difetti. Un difetto descritto batte un reso a sorpresa.
      requirements:
        title: Prima di pubblicare
        items:
          a: L'articolo deve essere tuo da vendere e legale nel tuo paese.
          b: Gli articoli vietati (contraffazioni, componenti pericolosi) vengono rimossi — leggi prima le regole.
          c: I venditori devono avere 18 anni o vendere con consenso genitoriale.
          d: Doveri di spedizione e reso cambiano se vendi come azienda invece che privatamente.
        guides_link: Guida per venditori
        terms_link: Termini di servizio
      cta:
        title: Pronto quando vuoi
        subtitle: Creare un account è gratuito e pubblicare richiede minuti.
        start: Crea un annuncio
        trade_in: O vendi a noi l'intero computer
    contact:
      title: Contattaci
      lede: Una domanda su un ordine, un annuncio o la piattaforma stessa? Qui arriva a una persona.
      form:
