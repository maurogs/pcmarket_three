        title: Cosa è coperto
        items:
          a: Rimborso completo se l'articolo non arriva mai.
          b: Rimborso completo se l'articolo è sostanzialmente diverso dall'annuncio.
          c: Rimborsi parziali per discrepanze minori, concordati nella controversia.
          d: Protezione dal momento del pagamento fino alla conferma della consegna.
          e: Una procedura di controversia strutturata in cui un moderatore esamina ogni caso.
          f: 'Un registro trasparente: ogni passo dell''ordine è timbrato.'
        fine_print: La protezione si applica agli ordini effettuati tramite PCMarket. Abusare dei rimborsi è motivo di sospensione dell'account.
      safeguards:
        title: Come teniamo pulito il marketplace
        review:
          title: Ogni annuncio viene verificato
          text: I nuovi annunci passano da una coda di moderazione prima di essere pubblicati. I moderatori controllano foto, descrizione e categoria prima di approvare.
        verified:
          title: Cerca il badge di verifica
          text: I venditori possono ottenere un badge di verifica confermando la propria identità e costruendo uno storico di vendite completate.
        reporting:
          title: Segnala qualsiasi cosa sospetta
          text: Chiunque può segnalare un annuncio con un clic. Abbastanza segnalazioni aperte riportano l'annuncio direttamente nella coda di verifica.
        chat:
          title: Mantieni le chat sulla piattaforma
          text: In una controversia, i moderatori leggono la chat di PCMarket tra acquirente e venditore. Restare in chat mantiene valide le tue prove.
      support:
        title: Serve una mano?
        email_title: E-mail
        email_hint: Rispondiamo entro un giorno lavorativo.
        phone_title: Telefono
        phone_hint: Durante l'orario d'ufficio nei giorni feriali.
        contact_title: Modulo di contatto
        contact_hint: Raccontaci cosa è successo e indica il numero d'ordine se ce l'hai.
        contact_cta: Vai al modulo di contatto
      faq:
        title: Domande frequenti
        q1: Il pagamento viene incassato direttamente dal venditore?
        a1: Ogni ordine passa prima dal nostro checkout. Dove i pagamenti con carta sono abilitati, i fondi vengono rilasciati al venditore solo dopo la conferma della consegna; la regolazione diretta è sempre spiegata sulla pagina dell'ordine.
        q2: E se l'articolo non arriva mai?
        a2: Apri una controversia dalla pagina dell'ordine. Quando il tracciamento non mostra alcuna consegna, ottieni un rimborso completo.
        q3: Posso restituire qualcosa per un ripensamento?
        a3: Gli acquisti da venditori professionisti godono del diritto legale di recesso di 14 giorni. Le vendite private seguono la policy di resi indicata dal venditore nell'annuncio — controllala sempre prima.
        q4: Come faccio a sapere se un venditore è affidabile?
        a4: Guarda valutazione, vendite completate e badge di verifica. Un account nuovo di zecca senza recensioni merita prudenza in più — inizia con un ordine piccolo.
        q5: Cosa succede quando segnalo un annuncio?
        a5: Un moderatore lo esamina. Tre segnalazioni aperte riportano automaticamente qualsiasi annuncio attivo nella coda di verifica, e i venditori che violano le regole vengono sanzionati.
        q6: Leggete le mie chat?
        a6: Le chat sono private. In una controversia, i moderatori possono leggere la conversazione tra acquirente e venditore per decidere con equità.
      cta:
        title: Pronto a comprare senza pensieri?
        subtitle: Sfoglia gli annunci coperti dalla protezione acquirenti PCMarket.
        browse: Sfoglia gli annunci
        how_it_works: Vedi come funziona
      legal_intro: 'Puoi anche leggere:'
