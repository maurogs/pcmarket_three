openapi: 3.1.0
info:
  title: PCMarket API
  version: 1.0.0
  description: |-
    JSON API v1 for the PCMarket PC-hardware marketplace. Every endpoint is served
    under `/api/v1` and returns JSON by default; the client locale for translated
    labels and messages comes from the `Accept-Language` header (supported: es, en,
    fr, de, it, pt; default es).

    Authentication uses bearer tokens (`Authorization: Bearer <token>`). Tokens are
    obtained from `POST /api/v1/sessions` (or `POST /api/v1/registration`) and are
    the same credentials used by the WebSocket layer: the `/cable` Action Cable
    endpoint accepts them either as a `?token=<token>` query parameter or as an
    `Authorization` header, and falls back to the website session cookie when no
    token is present.

    Errors use a uniform envelope: `{"error": {"code", "message", "details"}}`.
    List endpoints accept `page` and return `meta.pagination` plus a standard
    `Link` header. Public GET catalogue responses support `ETag` / `If-None-Match`.

    Rate limit: 300 requests per minute per token (per IP for anonymous requests);
    exceeding it returns 429 with the error envelope.
  contact:
    name: PCMarket
servers:
  - url: https://pcmarket.example.com/api
    description: Production
  - url: http://localhost:3000/api
    description: Local development
tags:
  - name: Session
    description: Token authentication and account lifecycle
  - name: Catalogue
    description: Public marketplace browsing
  - name: Engagement
    description: Favorites, saved searches, notifications, conversations, offers
  - name: Commerce
    description: Cart, checkout and orders
  - name: Sell
    description: Seller listing management and dashboard
  - name: Account
    description: Addresses, devices and API tokens
security:
  - bearerAuth: []
paths:
  /v1/config:
    get:
      tags: [Catalogue]
      summary: App configuration (categories, conditions, sort options, minimum offer price, web URLs, minimum app versions)
      security: []
      responses:
        '200':
          description: Configuration payload
          content:
            application/json:
              schema:
                type: object
                required: [categories, conditions, conditions_labels, sort_options_labels, pc_finder_labels, flags, web_urls, min_app_version]
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  conditions:
                    type: array
                    items: { type: string }
                  conditions_labels:
                    type: object
                    additionalProperties: { type: string }
                  carriers:
                    type: array
                    items: { type: string }
                    description: Carrier names accepted by the shipment transition
                  order_statuses:
                    type: array
                    items: { type: string }
                  flags:
                    type: object
                    additionalProperties: { type: boolean }
                    description: Feature-flag states (registry FeatureFlags::FEATURES) that gate app screens
                  sort_options_labels:
                    type: object
                    additionalProperties: { type: string }
                  pc_finder_labels:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties: { type: string }
                  web_urls:
                    type: object
                    additionalProperties: { type: string }
                  min_app_version:
                    type: object
                    properties:
                      ios: { type: [string, 'null'] }
                      android: { type: [string, 'null'] }
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/docs:
    get:
      tags: [Session]
      summary: Interactive API documentation (Redoc HTML page)
      security: []
      responses:
        '200':
          description: HTML documentation page
          content:
            text/html:
              schema: { type: string }
  /v1/openapi:
    get:
      tags: [Session]
      summary: This OpenAPI document
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 specification
          content:
            application/yaml:
              schema: { type: string }
  /v1/registration:
    post:
      tags: [Session]
      summary: Create an account and issue an API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email_address, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 30 }
                email_address: { type: string, format: email }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
                first_name: { type: string }
                last_name: { type: string }
                phone: { type: string }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                required: [user, token]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token: { type: string, description: Plaintext bearer token, shown once }
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/session:
    post:
      tags: [Session]
      summary: Sign in with email and password and get a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email_address, password]
              properties:
                email_address: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [user, token]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Session]
      summary: Revoke the current token (sign out)
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /v1/password_reset:
    post:
      tags: [Session]
      summary: Request a password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email_address]
              properties:
                email_address: { type: string }
      responses:
        '200':
          description: Instructions sent when the email is registered (always success-shaped)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /v1/me:
    get:
      tags: [Session]
      summary: Current user with engagement counters
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  unread_conversations: { type: integer }
                  unread_notifications: { type: integer }
                  cart_items: { type: integer }
  /v1/categories:
    get:
      tags: [Catalogue]
      summary: Category tree
      security: []
      responses:
        '200':
          description: Root categories with children
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Category'
                        - type: object
                          properties:
                            children:
                              type: array
                              items:
                                $ref: '#/components/schemas/Category'
  /v1/categories/{id}:
    get:
      tags: [Catalogue]
      summary: One category
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/listings:
    get:
      tags: [Catalogue]
      summary: Browse listings with filters, facets and sort
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Full-text search }
        - { name: category, in: query, schema: { type: string }, description: Category slug }
        - { name: min_price, in: query, schema: { type: [number, string] }, description: Minimum price in euros, e.g. 500.50 }
        - { name: max_price, in: query, schema: { type: [number, string] }, description: Maximum price in euros }
        - { name: 'condition[]', in: query, schema: { type: array, items: { type: string, enum: [brand_new, open_box, used_like_new, used_good, for_parts] } }, description: Condition filter }
        - { name: 'labels[]', in: query, schema: { type: array, items: { type: string } }, description: Label tags (e.g. rtx, atx) }
        - { name: 'tags[]', in: query, schema: { type: array, items: { type: string } }, description: Seller tags }
        - { name: seller, in: query, schema: { type: string }, description: Store slug }
        - { name: sort, in: query, schema: { type: string, enum: [best_match, newest, price_asc, price_desc, most_favorited] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        '200':
          description: Listing page
          content:
            application/json:
              schema:
                type: object
                required: [listings, meta]
                properties:
                  listings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ListingCard'
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
                      facets:
                        type: object
                        description: 'Facet buckets keyed by attribute (condition, labels, specs.…)'
                        additionalProperties:
                          type: array
                          items:
                            type: object
                            properties:
                              value: { type: string }
                              count: { type: integer }
                      filters:
                        type: object
                        description: Echo of the applied filters
        '304':
          description: Not modified (ETag match)
  /v1/listings/{id}:
    get:
      tags: [Catalogue]
      summary: Listing detail (visible listings only; drafts return 404)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  listing:
                    $ref: '#/components/schemas/ListingFull'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/stores:
    get:
      tags: [Catalogue]
      summary: Visible stores
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Store page
          content:
            application/json:
              schema:
                type: object
                properties:
                  stores:
                    type: array
                    items:
                      $ref: '#/components/schemas/Store'
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
  /v1/stores/{id}:
    get:
      tags: [Catalogue]
      summary: One store
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: Store slug }
      responses:
        '200':
          description: Store
          content:
            application/json:
              schema:
                type: object
                properties:
                  store:
                    $ref: '#/components/schemas/Store'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/stores/{store_id}/listings:
    get:
      tags: [Catalogue]
      summary: Listings of a store
      security: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema: { type: string }
        - { name: sort, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Listing page
          content:
            application/json:
              schema:
                type: object
                properties:
                  listings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ListingCard'
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
  /v1/stores/{store_id}/reviews:
    get:
      tags: [Catalogue]
      summary: Store reviews
      security: []
      parameters:
        - name: store_id
          in: path
          required: true
          schema: { type: string }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Review page
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/StoreReview'
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
  /v1/stores/{store_id}/follow:
    post:
      tags: [Engagement]
      summary: Follow a store
      parameters:
        - name: store_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Followed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  following: { type: boolean, const: true }
                  follower_count: { type: integer }
    delete:
      tags: [Engagement]
      summary: Unfollow a store
      parameters:
        - name: store_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Unfollowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  following: { type: boolean, const: false }
                  follower_count: { type: integer }
  /v1/pc_finder:
    get:
      tags: [Catalogue]
      summary: PC Finder metadata (games, resolutions, FPS targets, budget ranges, filter tags, localized labels)
      security: []
      responses:
        '200':
          description: PC Finder metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  pc_finder:
                    type: object
                    properties:
                      games:
                        type: array
                        items:
                          type: object
                          properties:
                            slug: { type: string }
                            name: { type: string }
                            demand: { type: string }
                            required_scores:
                              type: object
                              description: Required Performance::Scorer score per resolution and FPS target
                              additionalProperties:
                                type: object
                                additionalProperties: { type: integer }
                      resolutions:
                        type: array
                        items: { type: string }
                      fps_targets:
                        type: array
                        items: { type: integer }
                      budgets:
                        type: array
                        items: { type: integer }
                      filter_tags:
                        type: array
                        items: { type: string }
                      labels:
                        type: object
                        description: Localized labels grouped by resolution, fps and budget
                        additionalProperties:
                          type: object
                          additionalProperties: { type: string }
  /v1/pc_finder_results:
    get:
      tags: [Catalogue]
      summary: PC Finder quiz results (published machines that clear the required performance score)
      security: []
      parameters:
        - { name: game, in: query, schema: { type: string }, description: Game slug }
        - { name: 'games[]', in: query, schema: { type: array, items: { type: string } }, description: Up to three game slugs }
        - { name: resolution, in: query, schema: { type: string, enum: [1080p, 1440p, 2160p] } }
        - { name: fps, in: query, schema: { type: string, enum: ['60', '144', '240'] } }
        - { name: budget, in: query, schema: { type: string, enum: [under_700, 700_1200, 1200_2000, over_2000] } }
        - { name: 'tags[]', in: query, schema: { type: array, items: { type: string } }, description: Seller tag slugs (AND-ed) }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Result page ordered by value (best match first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  listings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ListingCard'
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
                      required_score: { type: [integer, 'null'] }
                      filters:
                        type: object
                        properties:
                          games:
                            type: array
                            items: { type: string }
                          resolution: { type: string }
                          fps: { type: string }
                          budget: { type: [string, 'null'] }
                          tags:
                            type: array
                            items: { type: string }
  /v1/countries:
    get:
      tags: [Catalogue]
      summary: Countries for address forms
      security: []
      responses:
        '200':
          description: Country list
          content:
            application/json:
              schema:
                type: object
                properties:
                  countries:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        name: { type: string }
  /v1/favorites:
    get:
      tags: [Engagement]
      summary: My favorite listings
      parameters:
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Favorite listings
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorites:
                    type: array
                    items:
                      type: object
                      properties:
                        favorite_id: { type: integer, description: 'Favorite record id (DELETE /v1/favorites/{id})' }
                        saved_price_money:
                          oneOf:
                            - $ref: '#/components/schemas/Money'
                            - type: 'null'
                          description: Price captured when the listing was favorited
                        price_dropped: { type: boolean }
                        listing:
                          $ref: '#/components/schemas/ListingCard'
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
    post:
      tags: [Engagement]
      summary: Favorite a listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_id]
              properties:
                listing_id: { type: integer }
      responses:
        '200':
          description: Favorited
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  favorited: { type: boolean, const: true }
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/favorites/{id}:
    delete:
      tags: [Engagement]
      summary: Remove a favorite (favorite record id)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, description: Favorite record id (see GET /v1/favorites) }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  favorited: { type: boolean, const: false }
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/saved_searches:
    get:
      tags: [Engagement]
      summary: My saved searches
      responses:
        '200':
          description: Saved searches
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved_searches:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavedSearch'
    post:
      tags: [Engagement]
      summary: Save a search (same query params as GET /v1/listings)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                query:
                  type: object
                  description: Filter map, e.g. {"q":"rtx","category":"gpus"}
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved_search:
                    $ref: '#/components/schemas/SavedSearch'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/saved_searches/{id}:
    delete:
      tags: [Engagement]
      summary: Delete a saved search
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/notifications:
    get:
      tags: [Engagement]
      summary: My notifications
      parameters:
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Notification page
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
  /v1/notifications_read:
    post:
      tags: [Engagement]
      summary: Mark all notifications as read
      responses:
        '200':
          description: Marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  unread: { type: integer, const: 0 }
  /v1/conversations:
    get:
      tags: [Engagement]
      summary: My conversations
      parameters:
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Conversation page
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: '#/components/schemas/Pagination'
    post:
      tags: [Engagement]
      summary: Start a conversation about a listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_id, body]
              properties:
                listing_id: { type: integer }
                body: { type: string }
      responses:
        '201':
          description: Conversation created (first message included)
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation:
                    $ref: '#/components/schemas/Conversation'
                  message:
                    $ref: '#/components/schemas/Message'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/conversations/{id}:
    get:
      tags: [Engagement]
      summary: One conversation (marked as read)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation:
                    $ref: '#/components/schemas/Conversation'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/conversations/{conversation_id}/messages:
    get:
      tags: [Engagement]
      summary: Messages of a conversation (cursor pagination)
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: integer }
        - { name: before_id, in: query, schema: { type: integer }, description: Return messages older than this message id }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        '200':
          description: Messages in chronological order
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  meta:
                    type: object
                    properties:
                      before_id: { type: [integer, 'null'] }
                      has_more: { type: boolean }
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Engagement]
      summary: Send a message
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: '#/components/schemas/Message'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/offers:
    get:
      tags: [Engagement]
      summary: Offers received (seller) or sent (buyer)
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [received, sent], default: received } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Offer page
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
