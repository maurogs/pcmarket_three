      summary: Place orders from the cart (direct mode or Stripe Checkout mode)
      description: >-
        Mode is chosen server-side (Stripe Checkout when the server is configured
        for it, direct otherwise). In direct mode each order starts as
        `pending_payment` and the seller confirms payment through
        `POST /v1/orders/{order_id}/payment_confirmation`. Replay-safe: send the
        same `checkout_token` to retrieve the previously created orders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address_id]
              properties:
                address_id: { type: integer }
                checkout_token: { type: string, description: Idempotency token; generated when omitted }
      responses:
        '201':
          description: Orders placed
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkout_token: { type: string }
                  mode: { type: string, enum: [direct, stripe] }
                  order_ids:
                    type: array
                    items: { type: integer }
                  conversation_ids:
                    type: array
                    items: { type: integer }
                  redirect_url: { type: [string, 'null'], description: Stripe Checkout URL when mode is stripe }
                  message: { type: string }
