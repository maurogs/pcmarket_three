  /v1/direct_uploads:
    post:
      tags: [Sell]
      summary: Register a direct upload (ActiveStorage direct-upload protocol)
      description: >-
        Same semantics as `ActiveStorage::DirectUploadsController`: send the blob
        descriptor, get back a `signed_id` plus the signed URL/headers to PUT the
        bytes to. Use the returned `signed_id` in listing create/update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blob]
              properties:
                blob:
                  type: object
                  required: [filename, byte_size, checksum]
                  properties:
                    filename: { type: string }
                    byte_size: { type: integer }
                    checksum: { type: string, description: Base64-encoded MD5 of the file }
                    content_type: { type: string }
                    metadata: { type: object }
      responses:
        '201':
          description: Blob registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  signed_id: { type: string }
                  direct_upload:
                    type: object
