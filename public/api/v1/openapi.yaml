components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Token obtained from POST /api/v1/sessions or /api/v1/registration. The same
        token authenticates the /cable WebSocket via ?token= or an Authorization
        header.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    OrderId:
      name: order_id
      in: path
      required: true
      schema: { type: integer }
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not allowed (e.g. banned account)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Record not found or not visible to this user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: State-machine conflict (stale transition or invalid transition)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Validation failed; details carries per-attribute messages
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Over 300 requests per minute
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [unauthorized, forbidden, not_found, invalid_request, invalid_transition, stale_transition, rate_limited, banned]
            message: { type: string, description: Localized via Accept-Language }
            details:
              type: [object, 'null']
              description: Extra context (e.g. model validation messages)
    Money:
      type: object
      required: [cents, currency, formatted]
      properties:
        cents: { type: integer }
        currency: { type: string, examples: [EUR] }
        formatted: { type: string, description: Localized string, e.g. "1.299,00 €" }
    Photo:
      type: object
      properties:
        card: { type: string, description: Absolute URL, ~400px representation }
        full: { type: string, description: Absolute URL, ~1200px representation }
    Pagination:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    User:
      type: object
      properties:
        id: { type: integer }
